# === FICHIER : docker-compose.yml ===
version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:

# Explications de l'orchestration :
# - service 'db' : Une base PostgreSQL standard. On masque les identifiants en utilisant des variables d'environnement.
# - service 'backend' : On monte le volume local (./backend:/app) pour que chaque modification de code sur Ubuntu soit répercutée en temps réel dans le conteneur (Hot Reload).
# - service 'frontend' : L'argument --host permet à Vite d'exposer le réseau au-delà du conteneur. CHOKIDAR_USEPOLLING force la détection des changements de fichiers, indispensable sur certains systèmes Linux couplés à Docker.
# - volumes (postgres_data) : Permet de ne pas perdre les données des rendez-vous ou des utilisateurs si on coupe les conteneurs.